<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup E-Commerce</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#2d89ff;
    color:white;
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    height:350px;
    background:linear-gradient(135deg,#2d89ff,#00c6ff);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:50px;
}

.hero p{
    margin:15px;
}

.hero button{
    padding:12px 25px;
    border:none;
    background:white;
    color:#2d89ff;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    width:90%;
    margin:auto;
}

.title{
    margin:40px 0 20px;
    font-size:30px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.info{
    padding:15px;
}

.price{
    color:#2d89ff;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

button.buy{
    width:100%;
    padding:12px;
    background:#2d89ff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

footer{
    margin-top:50px;
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>

<body>

<header>
<div class="logo">ShopGem</div>

<nav>
<a href="#">Home</a>
<a href="#">Produk</a>
<a href="#">Kategori</a>
<a href="#">Keranjang</a>
<a href="#">Profil</a>
</nav>
</header>

<section class="hero">
<h1>Selamat Datang di ShopGem</h1>
<p>Temukan produk terbaik dengan harga terbaik.</p>
<button>Belanja Sekarang</button>
</section>

<div class="container">

<h2 class="title">Produk Terbaru</h2>

<div class="products">

<div class="card">
<img src="https://picsum.photos/300/200?1">
<div class="info">
<h3>Laptop Gaming</h3>
<p class="price">Rp12.999.000</p>
<button class="buy">Tambah ke Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?2">
<div class="info">
<h3>Smartphone</h3>
<p class="price">Rp4.299.000</p>
<button class="buy">Tambah ke Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?3">
<div class="info">
<h3>Headset</h3>
<p class="price">Rp599.000</p>
<button class="buy">Tambah ke Keranjang</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?4">
<div class="info">
<h3>Smart Watch</h3>
<p class="price">Rp1.299.000</p>
<button class="buy">Tambah ke Keranjang</button>
</div>
</div>

</div>

</div>

<footer>
© 2026 ShopGem | Mockup E-Commerce HTML
</footer>

</body>
</html>
