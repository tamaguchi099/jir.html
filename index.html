<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GemStore</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 8%;
background:#2563eb;
color:white;
}

.logo{
font-size:28px;
font-weight:bold;
}

.menu a{
color:white;
text-decoration:none;
margin-left:20px;
}

.hero{
height:350px;
background:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200") center/cover;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:45px;
background:rgba(0,0,0,.4);
padding:15px 25px;
border-radius:10px;
}

.title{
text-align:center;
margin:40px 0 20px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px 8%;
}

.card{
background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.info{
padding:15px;
text-align:center;
}

.price{
font-size:22px;
font-weight:bold;
color:#2563eb;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

footer{
margin-top:40px;
padding:20px;
background:#111827;
color:white;
text-align:center;
}
</style>
</head>

<body>

<header>
<div class="logo">💎 GemStore</div>

<div class="menu">
<a href="#">Home</a>
<a href="#">Produk</a>
<a href="#">Promo</a>
<a href="#">Kontak</a>
</div>
</header>

<section class="hero">
<h1>Belanja Lebih Mudah</h1>
</section>

<h2 class="title">Produk Populer</h2>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600">
<div class="info">
<h3>Laptop</h3>
<p class="price">Rp12.999.000</p>
<button>Beli</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600">
<div class="info">
<h3>iPhone</h3>
<p class="price">Rp16.999.000</p>
<button>Beli</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600">
<div class="info">
<h3>Headset</h3>
<p class="price">Rp799.000</p>
<button>Beli</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=600">
<div class="info">
<h3>Smartwatch</h3>
<p class="price">Rp1.499.000</p>
<button>Beli</button>
</div>
</div>

</div>

<footer>
<h2>GemStore</h2>
<p>Belanja Aman • Cepat • Terpercaya</p>
</footer>

</body>
</html>
